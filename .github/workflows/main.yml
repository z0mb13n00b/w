name: Build JAR

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build JAR
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Waifus4J-jar
          path: build/libs/*.jar
          if-no-files-found: error
